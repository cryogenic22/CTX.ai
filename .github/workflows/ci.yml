name: CI

on:
  push:
    branches: [main]
    # Tag pushes re-run the version gate so the tag must match
    # pyproject / ctxpack.__version__ (optional leading "v").
    tags: ["v*", "[0-9]*"]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the checkout.
permissions:
  contents: read

# Fail-closed: do NOT cancel in-progress matrix cells. A superseded run
# finishing is fine; silently dropping half the matrix is not.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Official actions are pinned to full 40-char commit SHAs (v6 generation,
# Node 24). The trailing comment records the tag and the date the tag
# resolved to, so the pin stays auditable.
jobs:
  # ── core: the built package must import and expose its console script
  #    with ZERO optional dependencies, PROVEN from OUTSIDE the checkout so
  #    the INSTALLED artifact (not the source tree) is exercised. Never
  #    invokes pytest — pytest is not a core dependency (Codex Finding 1).
  core:
    name: core (zero-dep, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (2026-07-16)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (2026-06-23)
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core only (no extras, no test runner)
        run: pip install .
      - name: Import + console-script smoke OUTSIDE the checkout
        # cd out of the repo so `import ctxpack` resolves to the INSTALLED
        # package, not the source tree (py3.10 has no `python -P`).
        run: |
          cd "${RUNNER_TEMP}"
          python -c "import ctxpack; print('import OK from', ctxpack.__file__)"
          python -c "import importlib.metadata as m; print('version', m.version('ctxpack'))"
          ctxpack --help
      - name: Assert no optional deps leaked into the core install
        run: |
          cd "${RUNNER_TEMP}"
          python - <<'PY'
          import importlib.util as u
          leaked = [m for m in ("yaml", "tiktoken", "tree_sitter", "mcp")
                    if u.find_spec(m) is not None]
          assert not leaked, f"optional deps present in the core env: {leaked}"
          print("core env is dep-free")
          PY

  # ── test: the ORDINARY (non-integration) lane — full non-slow suite MINUS
  #    the code/MCP integration tree (tests/code), with only the `test`
  #    extra (pytest + PyYAML, never `all`). Broad OS/Python matrix per the
  #    owner (reviewer minimum): 3.10-3.13 on Ubuntu, endpoints elsewhere.
  test:
    name: test (${{ matrix.os }} py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,  python-version: "3.10"}
          - {os: ubuntu-latest,  python-version: "3.11"}
          - {os: ubuntu-latest,  python-version: "3.12"}
          - {os: ubuntu-latest,  python-version: "3.13"}
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.13"}
          - {os: macos-latest,   python-version: "3.10"}
          - {os: macos-latest,   python-version: "3.13"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (2026-07-16)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (2026-06-23)
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test extra (pytest + PyYAML; NOT all)
        run: pip install ".[test]"
      - name: Run ordinary lane (no -x; report every failure)
        run: python -m pytest tests/ -q -m "not slow" --ignore=tests/code

  replay-byte-pin:
    name: replay-byte-pin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      TIKTOKEN_CACHE_DIR: ./.tmp/tiktoken-cache
      CTX_REPLAY_TOKENIZER_READY_FILE: ./.tmp/tiktoken-cache/cl100k_base.ready
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (2026-07-16)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (2026-06-23)
        with:
          python-version: "3.12"
      - name: Install package + test extra
        run: pip install ".[test]"
      - name: Prewarm pinned replay tokenizer cache
        shell: bash
        run: |
          mkdir -p "${TIKTOKEN_CACHE_DIR}"
          python -c 'import os,pathlib,tiktoken;tiktoken.get_encoding("cl100k_base");pathlib.Path(os.environ["CTX_REPLAY_TOKENIZER_READY_FILE"]).write_text("cl100k_base ready\\n",encoding="utf-8")'
      - name: Build replay report
        shell: bash
        run: python -m ctxpack.benchmarks.replay --fixture tests/fixtures/replay/synthetic-l1 --output out.json
      - name: Assert exact pinned bytes (out.json == expected.json)
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          out_bytes = pathlib.Path("out.json").read_bytes()
          expected_bytes = subprocess.check_output(["git", "show", "HEAD:tests/fixtures/replay/synthetic-l1/expected.json"])
          sys.exit(0 if out_bytes == expected_bytes else 1)
          PY
      - name: Run replay pytest (must execute with zero skips)
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_replay_benchmark.py -rs | tee replay-pytest.log
          python - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("replay-pytest.log").read_text(encoding="utf-8", errors="replace")
          passed = [int(x) for x in re.findall(r"(\d+)\s+passed", text)]; skipped = [int(x) for x in re.findall(r"(\d+)\s+skipped", text)]
          pc = passed[-1] if passed else 0; sc = skipped[-1] if skipped else 0
          print(f"::notice::replay-pytest-counts passed={pc} skipped={sc}")
          raise SystemExit(0 if sc == 0 else 1)
          PY

  # ── extras: the OPTIONAL-INTEGRATION lane — install every runtime extra
  #    and run the FULL non-slow suite (incl. tests/code code-packer + MCP,
  #    and the analytics hermetic lane) on one Ubuntu/3.12 cell.
  extras:
    name: extras (ubuntu py3.12, .[all,test])
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (2026-07-16)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (2026-06-23)
        with:
          python-version: "3.12"
      - name: Install package + ALL runtime extras + test runner
        run: pip install ".[all,test]"
      - name: Install coverage (product-code floor; not a runtime dep)
        run: pip install pytest-cov
      - name: Run full non-slow suite (code / MCP / analytics integrations)
        # Line coverage of ctxpack/ excluding ctxpack/benchmarks/.
        # Measured 88.60% on the non-slow suite (2026-11-26, Python 3.12).
        # The floor is 85 so the percentage can only fall to that line.
        run: python -m pytest tests/ -q -m "not slow" --cov=ctxpack --cov-report=term --cov-fail-under=85

  # ── gates: the non-suite guards the deterministic lane depends on, plus
  #    the tokenizer calibration re-verified against the live encoding
  #    (needs the [code] extra's tiktoken, hence .[all,test]).
  gates:
    name: gates (claims + registry + tokenizer + release-manifest + doc-privacy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (2026-07-16)
        with:
          # release-manifest gate needs full history for git rev-list --count
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (2026-06-23)
        with:
          python-version: "3.12"
      - name: Install package + all runtime extras + test runner
        run: pip install ".[all,test]"
      - name: Claims gate
        run: python scripts/check_claims.py
      - name: Capability registry gate
        run: python scripts/check_capability_registry.py
      - name: Token-accounting gate (live tokenizer via [code] extra)
        run: python -m pytest tests/test_token_accounting.py -q
      - name: Release-manifest gate (audit record vs git/artifacts/note)
        run: python scripts/check_release_manifest.py
      - name: Doc-privacy gate (no machine-specific owner path in shipped docs)
        run: python scripts/check_doc_privacy.py

  # ── artifact: build wheel + sdist, check BOTH, install the wheel into a
  #    CLEAN venv, assert the metadata version, smoke the console script.
  artifact:
    name: artifact (build + clean-install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (2026-07-16)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (2026-06-23)
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          pip install build twine
          python -m build
      - name: Check both distributions
        run: twine check dist/*
      - name: Version single-source, tag match, schema packaged in the wheel
        run: python scripts/check_version.py --wheel dist/*.whl
      - name: Clean-venv install of the WHEEL + metadata + CLI smoke
        run: |
          python -m venv "${RUNNER_TEMP}/clean"
          "${RUNNER_TEMP}/clean/bin/pip" install --upgrade pip
          "${RUNNER_TEMP}/clean/bin/pip" install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/clean/bin/python" - <<'PY'
          import importlib.metadata as m
          v = m.version("ctxpack")
          from ctxpack.core.code.telemetry import load_schema
          schema = load_schema()
          assert schema["title"] == "Code-packer telemetry events", schema.get("title")
          import ctxpack  # noqa: F401 — dep-free import from the clean env
          print("clean wheel install OK, version", v)
          PY
          "${RUNNER_TEMP}/clean/bin/python" "${GITHUB_WORKSPACE}/scripts/check_version.py" --installed
          "${RUNNER_TEMP}/clean/bin/ctxpack" --help

  # ── code: tests/code on every OS/Python cell, not only the ubuntu
  #    3.12 extras job. Needs the code extra (tree-sitter) plus the test
  #    extra. The ordinary lane stays free of tree-sitter.
  code:
    name: code (${{ matrix.os }} py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,  python-version: "3.10"}
          - {os: ubuntu-latest,  python-version: "3.11"}
          - {os: ubuntu-latest,  python-version: "3.12"}
          - {os: ubuntu-latest,  python-version: "3.13"}
          - {os: windows-latest, python-version: "3.10"}
          - {os: windows-latest, python-version: "3.13"}
          - {os: macos-latest,   python-version: "3.10"}
          - {os: macos-latest,   python-version: "3.13"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (2026-07-16)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (2026-06-23)
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + code extra + test extra
        run: pip install ".[code,test]"
      - name: Run tests/code
        run: python -m pytest tests/code -q -m "not slow"

  # ── quality: ratchets. Product pyflakes at zero, mypy error count at
  #    or under the recorded baseline, import-linter contracts, and the
  #    pyproject/runtime version match. Optional imports are installed so
  #    the mypy count matches the baseline (missing stubs would add
  #    import-not-found errors and move the floor).
  quality:
    name: quality (ruff, mypy ratchet, import-linter, version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (2026-07-16)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (2026-06-23)
        with:
          python-version: "3.12"
      - name: Install package, extras, and the ratchet tools
        # mypy is pinned: the error-count baseline is measured on 2.4.1.
        # A floating mypy release would move the count without a code change.
        run: pip install ".[all,test]" 'ruff==0.17.6' 'mypy==2.4.1' 'import-linter==2.17'
      - name: Ruff pyflakes (F) on ctxpack, benchmarks excluded
        run: ruff check --select F ctxpack --exclude ctxpack/benchmarks
      - name: Mypy error-count ratchet
        run: python scripts/check_mypy_ratchet.py
      - name: Import-linter architecture contracts
        run: lint-imports
      - name: Version single-source (pyproject, runtime, installed, tag)
        run: python scripts/check_version.py --installed

  # ── ci-required: the single stable check for branch protection. Fail-
  #    closed aggregator — passes only if EVERY upstream job succeeded.
  #    `if: always()` so it still runs (and fails) when an upstream job
  #    fails, is cancelled, or is skipped.
  ci-required:
    name: ci-required
    needs: [core, test, replay-byte-pin, extras, gates, artifact, code, quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all upstream jobs to have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream job results: ${results}"
          for r in ${results}; do
            if [ "${r}" != "success" ]; then
              echo "::error::a required job did not succeed (saw '${r}')"
              exit 1
            fi
          done
          echo "all required jobs succeeded"
