name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -x -q

  # Dedicated tokenizer job (reviewer finding Q2-4): the calibration
  # KILL gate runs everywhere via committed cl100k counts; this job
  # additionally installs tiktoken so the frozen counts are re-verified
  # against the live encoding on every push.
  tokenizer-calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + tokenizer
        run: pip install -e . pytest tiktoken
      - name: Run token-accounting gate (with live tokenizer)
        run: python -m pytest tests/test_token_accounting.py -q
