name: CTX Verify (Advisory)

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

# Report-only. contents: read is enough to check out the PR.
# actions: write is required to upload the findings artifact when
# the workflow token is restricted.
permissions:
  contents: read
  actions: write

jobs:
  advisory:
    name: advisory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Same Node 24 pin as ci.yml. fetch-depth 0 so the three-dot
        # range between base and head is present.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (2026-07-16)
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        # actions/setup-python@v5 runs on Node 20. Runners removed
        # Node 20 on 2026-09-23, so this job uses the same v6 pin as
        # .github/workflows/ci.yml and still selects Python 3.13.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (2026-06-23)
        with:
          python-version: "3.13"

      - name: Install ctxpack 1.1.0 into an isolated venv
        run: |
          set -euo pipefail
          wheel="/tmp/ctxpack-1.1.0-py3-none-any.whl"
          url="https://github.com/cryogenic22/CTX.ai/releases/download/v1.1.0/ctxpack-1.1.0-py3-none-any.whl"
          expected="5a5ee753c65cf83a508dd51805fa8817d10835e8bcbea492eb8c8154d6372d1e"
          curl -fsSL -o "${wheel}" "${url}"
          printf '%s  %s\n' "${expected}" "${wheel}" | sha256sum -c -
          python -m venv /tmp/ctx-venv
          /tmp/ctx-venv/bin/pip install --disable-pip-version-check --no-cache-dir "${wheel}"

      - name: Write pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("/tmp/pr_body.md").write_text(
              os.environ.get("PR_BODY") or "", encoding="utf-8")
          PY

      - name: ctxpack verify (advisory)
        continue-on-error: true
        run: |
          set -o pipefail
          /tmp/ctx-venv/bin/ctxpack verify \
            --repo . \
            --contract .ctx/contract.json \
            --range "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            --pr-body /tmp/pr_body.md \
            --findings-log /tmp/ctx-findings.jsonl \
            --format md \
            | tee "${GITHUB_STEP_SUMMARY}"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (node24)
        with:
          name: ctx-findings
          path: /tmp/ctx-findings.jsonl
          if-no-files-found: ignore
