[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxpack"
version = "0.5.0rc1"
description = "Deterministic session memory for long-running agents — pack-on-compact ledger for Claude Code ('compaction is a commit, not a loss event') + zero-dependency domain-knowledge packer with progressive hydration"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "Kapil Pant"},
]
keywords = [
    "llm",
    "context",
    "agent-memory",
    "session-memory",
    "claude-code",
    "compaction",
    "mcp",
    "compression",
    "ctx",
    "domain-knowledge",
    "rag",
    "context-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Code-packer producer (CP-002+): tree-sitter front ends for Python
# and TSX, plus tiktoken for the pinned BPE counter (see
# docs/adr/0001-tokeniser-choice.md). Optional so the prose-domain
# packer remains zero-dep — install with `pip install ctxpack[code]`.
code = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-typescript>=0.21",
    "tiktoken>=0.7",
]
# MCP server (ctx/session_*, ctx/hydrate, code-packer tools). Optional so
# the core stays zero-dep: hooks + `ctxpack session` CLI work without it.
mcp = [
    # Upper bound: an mcp 3.0 release must not break installs.
    "mcp>=1.0,<3",
]
# Analytics domain-pack compiler (ctxpack.modules.analytics): PyYAML for
# full YAML domain packs (folded scalars/anchors). Optional so the prose
# packer stays zero-dep — install with `pip install ctxpack[analytics]`.
analytics = [
    "PyYAML>=6.0",
]
# All optional runtime features (code + mcp + analytics).
all = [
    "ctxpack[code,mcp,analytics]",
]
# Test runner + the DIRECT deps the ordinary (non-integration) test lane
# needs to COLLECT and run non-vacuously: pytest, PyYAML (hermetic
# analytics lane), tiktoken (token-accounting), and mcp (MCP handler tests
# plus the module-level collection dependency of test_mcp_tool_budget.py).
# These are listed directly, NOT via `ctxpack[all]` — tree-sitter (the
# code-packer) is deliberately excluded, so the ordinary lane and the
# `.[all,test]` integration lane stay distinct (Codex Finding 2). The CI
# `extras` job installs `.[all,test]` to exercise the code-packer.
test = [
    "pytest>=7.0",
    "PyYAML>=6.0",
    "tiktoken>=0.7",
    "mcp>=1.0,<3",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/cryogenic22/CTX.ai"
Repository = "https://github.com/cryogenic22/CTX.ai"
Documentation = "https://github.com/cryogenic22/CTX.ai#readme"
Issues = "https://github.com/cryogenic22/CTX.ai/issues"

[project.scripts]
ctxpack = "ctxpack.cli.main:main"

[tool.setuptools.packages.find]
include = ["ctxpack*"]
exclude = ["tests*"]

# Non-Python data the installed package loads by path. Without this the
# wheel omits the code-packer telemetry schema and load_schema() fails
# after a clean install.
[tool.setuptools.package-data]
ctxpack = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that require an external codebase (e.g. SCRIPTIVA_ROOT) or otherwise take longer than a few seconds. Excluded from the fast regression contract: pytest -m \"not slow\"",
]

# Product-code line coverage. Benchmarks are research code and are not
# part of the floor. The CI quality job passes --cov-fail-under.
[tool.coverage.run]
source = ["ctxpack"]
omit = [
    "ctxpack/benchmarks/*",
    "ctxpack/benchmarks/**/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = false

# Pyflakes gate. Benchmarks are excluded (research scripts, not the
# product floor). Per-file ignores below are temporary: those files are
# owned by the parallel brief-composer PR and cannot be edited here.
[tool.ruff]
extend-exclude = ["ctxpack/benchmarks"]
target-version = "py310"

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# TODO(v1.0-pr-b): remove once F-class errors in cli/main.py are fixed.
"ctxpack/cli/main.py" = ["F401", "F541"]
# TODO(v1.0-pr-b): remove once F-class errors in the MCP server are fixed.
# The module path is ctxpack/integrations/mcp_server.py (there is no
# top-level ctxpack/mcp_server.py). Parallel PR #30 edits this file.
"ctxpack/integrations/mcp_server.py" = ["F401"]
# TODO(v1.0-pr-b): remove once the unused json import is fixed.
# Parallel PR #30 edits this file.
"ctxpack/agent/transcript_parser.py" = ["F401"]

# Architecture contract. core is the bottom of the product stack and must
# not grow imports of agent, cli, modules, the MCP server, or benchmarks.
# cli may import agent, and agent may import core. As of this ratchet the
# checked graph has no forbidden edge, so there is no ignore_imports list
# to grandfather. A new violation fails lint-imports; do not add an
# ignore without a # TODO(v1.1) comment on that edge.
[tool.importlinter]
root_packages = ["ctxpack"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "ctxpack.core does not import upward"
type = "forbidden"
source_modules = ["ctxpack.core"]
forbidden_modules = [
    "ctxpack.agent",
    "ctxpack.cli",
    "ctxpack.modules",
    "ctxpack.integrations.mcp_server",
    "ctxpack.benchmarks",
]

[[tool.importlinter.contracts]]
name = "cli -> agent -> core"
type = "layers"
layers = [
    "ctxpack.cli",
    "ctxpack.agent",
    "ctxpack.core",
]
