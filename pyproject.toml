[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxpack"
version = "0.5.0rc1"
description = "Deterministic session memory for long-running agents — pack-on-compact ledger for Claude Code ('compaction is a commit, not a loss event') + zero-dependency domain-knowledge packer with progressive hydration"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "Kapil Pant"},
]
keywords = [
    "llm",
    "context",
    "agent-memory",
    "session-memory",
    "claude-code",
    "compaction",
    "mcp",
    "compression",
    "ctx",
    "domain-knowledge",
    "rag",
    "context-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Code-packer producer (CP-002+): tree-sitter front ends for Python
# and TSX, plus tiktoken for the pinned BPE counter (see
# docs/adr/0001-tokeniser-choice.md). Optional so the prose-domain
# packer remains zero-dep — install with `pip install ctxpack[code]`.
code = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-typescript>=0.21",
    "tiktoken>=0.7",
]
# MCP server (ctx/session_*, ctx/hydrate, code-packer tools). Optional so
# the core stays zero-dep: hooks + `ctxpack session` CLI work without it.
mcp = [
    "mcp>=1.0",
]
# Analytics domain-pack compiler (ctxpack.modules.analytics): PyYAML for
# full YAML domain packs (folded scalars/anchors). Optional so the prose
# packer stays zero-dep — install with `pip install ctxpack[analytics]`.
analytics = [
    "PyYAML>=6.0",
]
# All optional runtime features (code + mcp + analytics).
all = [
    "ctxpack[code,mcp,analytics]",
]
# Test runner + the DIRECT deps the ordinary (non-integration) test lane
# needs to COLLECT and run non-vacuously: pytest, PyYAML (hermetic
# analytics lane), tiktoken (token-accounting), and mcp (MCP handler tests
# plus the module-level collection dependency of test_mcp_tool_budget.py).
# These are listed directly, NOT via `ctxpack[all]` — tree-sitter (the
# code-packer) is deliberately excluded, so the ordinary lane and the
# `.[all,test]` integration lane stay distinct (Codex Finding 2). The CI
# `extras` job installs `.[all,test]` to exercise the code-packer.
test = [
    "pytest>=7.0",
    "PyYAML>=6.0",
    "tiktoken>=0.7",
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/cryogenic22/CTX.ai"
Repository = "https://github.com/cryogenic22/CTX.ai"
Documentation = "https://github.com/cryogenic22/CTX.ai#readme"
Issues = "https://github.com/cryogenic22/CTX.ai/issues"

[project.scripts]
ctxpack = "ctxpack.cli.main:main"

[tool.setuptools.packages.find]
include = ["ctxpack*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that require an external codebase (e.g. SCRIPTIVA_ROOT) or otherwise take longer than a few seconds. Excluded from the fast regression contract: pytest -m \"not slow\"",
]
