[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxpack"
version = "1.1.0"
description = "Deterministic session memory for long-running agents — pack-on-compact ledger for Claude Code ('compaction is a commit, not a loss event') + zero-dependency domain-knowledge packer with progressive hydration"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
authors = [
    {name = "Kapil Pant"},
]
keywords = [
    "llm",
    "context",
    "agent-memory",
    "session-memory",
    "claude-code",
    "compaction",
    "mcp",
    "compression",
    "ctx",
    "domain-knowledge",
    "rag",
    "context-engineering",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Code-packer producer (CP-002+): tree-sitter front ends for Python
# and TSX, plus tiktoken for the pinned BPE counter (see
# docs/adr/0001-tokeniser-choice.md). Optional so the prose-domain
# packer remains zero-dep — install with `pip install ctxpack[code]`.
code = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-typescript>=0.21",
    "tiktoken>=0.7",
]
# MCP server (ctx/session_*, ctx/hydrate, code-packer tools). Optional so
# the core stays zero-dep: hooks + `ctxpack session` CLI work without it.
mcp = [
    # mcp 2.0 removed Server.list_tools / call_tool and renamed
    # Tool.inputSchema to input_schema. create_server() crashes on that
    # line, and mypy reports the old keyword as an error. Stay on 1.x.
    "mcp>=1.0,<2",
]
# Analytics domain-pack compiler (ctxpack.modules.analytics): PyYAML for
# full YAML domain packs (folded scalars/anchors). Optional so the prose
# packer stays zero-dep — install with `pip install ctxpack[analytics]`.
analytics = [
    "PyYAML>=6.0",
]
# Advisory Jev adapter. OFF by default and intentionally absent from
# [all]: the module is stdlib only (urllib.request) and never writes
# the ledger. Install with `pip install ctxpack[jev]` to opt in.
jev = []
# All optional runtime features (code + mcp + analytics). jev is not
# included.
all = [
    "ctxpack[code,mcp,analytics]",
]
# Test runner + the DIRECT deps the ordinary (non-integration) test lane
# needs to COLLECT and run non-vacuously: pytest, PyYAML (hermetic
# analytics lane), tiktoken (token-accounting), and mcp (MCP handler tests
# plus the module-level collection dependency of test_mcp_tool_budget.py).
# These are listed directly, NOT via `ctxpack[all]` — tree-sitter (the
# code-packer) is deliberately excluded, so the ordinary lane and the
# `.[all,test]` integration lane stay distinct (Codex Finding 2). The CI
# `extras` job installs `.[all,test]` to exercise the code-packer.
test = [
    "pytest>=7.0",
    "PyYAML>=6.0",
    "tiktoken>=0.7",
    "mcp>=1.0,<2",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/cryogenic22/CTX.ai"
Repository = "https://github.com/cryogenic22/CTX.ai"
Documentation = "https://github.com/cryogenic22/CTX.ai#readme"
Issues = "https://github.com/cryogenic22/CTX.ai/issues"

[project.scripts]
ctxpack = "ctxpack.cli.main:main"

[tool.setuptools.packages.find]
include = ["ctxpack*"]
exclude = ["tests*"]

# Non-Python package data. The code-packer telemetry loader opens
# ctxpack/schemas/telemetry-events.schema.json relative to the installed
# package; without this the wheel omits the schema and load_schema fails.
[tool.setuptools.package-data]
ctxpack = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that require an external codebase (e.g. SCRIPTIVA_ROOT) or otherwise take longer than a few seconds. Excluded from the fast regression contract: pytest -m \"not slow\"",
]

[tool.ruff]
# Benchmarks are research code. The F-gate locks the product tree.
extend-exclude = ["ctxpack/benchmarks"]

[tool.ruff.lint]
select = ["F"]

[tool.importlinter]
root_packages = ["ctxpack"]

# Core never imports agent, CLI, experimental modules, the MCP server,
# or the benchmark tree. The layered contract is cli -> agent -> core
# (higher may import lower). Any edge that already violates a contract
# is listed under ignore_imports with a TODO(v1.1) comment; a new edge
# fails the gate. There are no such edges today.
#
# The MCP server module in this tree is ctxpack.integrations.mcp_server.
# There is no ctxpack.mcp_server package; import-linter rejects a
# forbidden target that does not exist, so the contract names the module
# that is actually importable.
[[tool.importlinter.contracts]]
name = "Core does not import agent, cli, modules, mcp, or benchmarks"
type = "forbidden"
source_modules = ["ctxpack.core"]
forbidden_modules = [
    "ctxpack.agent",
    "ctxpack.cli",
    "ctxpack.modules",
    "ctxpack.integrations.mcp_server",
    "ctxpack.benchmarks",
]

[[tool.importlinter.contracts]]
name = "Layers descend cli to agent to core"
type = "layers"
layers = [
    "ctxpack.cli",
    "ctxpack.agent",
    "ctxpack.core",
]

[tool.coverage.run]
source = ["ctxpack"]
omit = [
    "ctxpack/benchmarks/*",
    "ctxpack/benchmarks/*/*",
    "ctxpack/benchmarks/*/*/*",
    "ctxpack/benchmarks/*/*/*/*",
]
